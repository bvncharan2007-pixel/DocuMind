    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DocuMind — AI-powered document intelligence. Chat with PDFs, get grounded answers with source citations." />
    <title>DocuMind | AI Document Intelligence</title>
    <!-- Prevent theme flash: apply saved preference before React hydrates -->
    <script>
      try {
        var t = localStorage.getItem('documind_theme');
        if (!t && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        document.documentElement.setAttribute('data-theme', t || 'dark');
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
